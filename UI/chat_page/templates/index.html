<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask & Brython Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/brython@3.11/brython.min.js"></script>
</head>
<body onload="brython()">

    <div id="chat-window" style="height:300px; border:1px solid #ccc; overflow:auto;">
        <!-- Chat history will go here -->
    </div>

    <input type="text" id="text_bar">
    <button id="Send">Send</button>

    <!-- Brython code -->
    <script type="text/python">
        from browser import document

        def append_message(event):
            chat_window = document["chat-window"]
            text_bar = document["text_bar"]
            new_element = document.createElement("div")
            new_element.innerHTML = f"<p>User: {text_bar.value}</p>"
            chat_window.appendChild(new_element)
            text_bar.value = ""

        document["Send"].bind("click", append_message)
    </script>

</body>
</html>
