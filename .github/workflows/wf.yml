name: Workflows

on:
  push:
  schedule:
    - cron: '0 0 * * *'

jobs:
  ToxTests:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git credentials
        run: echo "machine github.com login $GIT_USER password $GIT_PASS" > ~/.netrc
        env:
          GIT_USER : Somerandomguy10111
          GIT_PASS : ${{ secrets.PYSCRAPE_PAT }}
      - uses: Somerandomguy10111/devops/actions/basepy@main
      - uses: Somerandomguy10111/devops/actions/chrome@main
      - uses: Somerandomguy10111/devops/actions/toxtests@main
        env:
          OPENAI_API_KEY: ${{ secrets.DEV_OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.DEV_GOOGLE_API_KEY }}
          SEARCH_ENGINE_ID: ${{ secrets.DEV_SEARCH_ENGINE_ID }}
  Dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: Somerandomguy10111/devops/actions/basepy@main
      - uses: Somerandomguy10111/devops/actions/deptry@main
        with:
          skip_install: "true"
